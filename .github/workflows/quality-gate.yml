name: Quality Gate

# Fast PR gate, a few minutes on a hosted runner (see the job timeout below): ESLint, Stylelint and HTML validation,
# typecheck, the full Node regression lane, a small set of critical real-Chromium smoke tests, the production build,
# the production dependency audit and a patch whitespace check. One job, no matrix: compute is billed per minute.
#
# The complete Chromium regression suite is deliberately NOT run here (about 25 minutes on a hosted runner). Run it
# locally before a major release or after a substantial high-risk change:
#
#   npm run test:regression
#
# Which tests are in the smoke set is the `--test-name-pattern` of `test:ci:browser` in package.json; a Node test
# (three-r160-npm-vite.spec.mjs) fails if a selected test is renamed or if any spec belongs to neither lane.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    # Fail-safe only, not an expected runtime. This is one sequential job (no matrix, no parallel browser runs), and
    # hosted-runner browser execution has become variable: the smoke lane took about 5.5 minutes on one recent run and
    # more than 9 on another. Fifteen minutes bounds a stuck run. The complete Chromium regression suite stays excluded.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Required checks: keep in sync with the `quality:ci` script in package.json.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run -s typecheck

      - name: Tests — Node
        run: npm run test:ci:node

      # Every spec launches headless Chromium only, so the headless shell is all that is needed (no full Chromium).
      - name: Install Playwright Chromium (headless shell)
        run: npx playwright install --with-deps --only-shell chromium

      - name: Tests — Browser smoke
        run: npm run test:ci:browser

      - name: Build
        run: npm run build

      - name: Production audit
        run: npm audit --omit=dev

      - name: Patch whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "${BASE_SHA}...${HEAD_SHA}"
